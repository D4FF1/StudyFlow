<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow</title>
    <meta
      name="description"
      content="StudyFlow is a modern student productivity app for tasks, goals, analytics, focus, and planning."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
            },
            boxShadow: {
              soft: '0 8px 30px rgba(15, 23, 42, 0.08)'
            },
            colors: {
              accent: {
                50: '#eef8ff',
                100: '#d9f0ff',
                500: '#4f8cff',
                600: '#3a74ff',
                700: '#285ae5'
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 selection:bg-accent-100 selection:text-accent-700">
    <div id="app-shell" class="min-h-screen bg-slate-50 dark:bg-slate-950">
      <div class="fixed inset-0 z-20 hidden bg-slate-950/50 backdrop-blur-sm" id="mobile-overlay"></div>

      <aside id="sidebar" class="fixed left-0 top-0 z-30 flex h-screen w-72 -translate-x-full flex-col border-r border-slate-200 bg-white/90 p-4 shadow-soft backdrop-blur-xl transition-all duration-300 dark:border-slate-800 dark:bg-slate-900/90 md:translate-x-0">
        <div class="flex items-center justify-between px-2 pb-4 pt-2">
          <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-accent-500 to-violet-500 text-lg font-bold text-white shadow-lg shadow-accent-500/20">S</div>
            <div>
              <div class="text-lg font-bold tracking-tight">StudyFlow</div>
            </div>
          </div>
          <button id="close-sidebar" class="rounded-lg border border-slate-200 p-2 md:hidden dark:border-slate-700">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>

        <nav class="mt-5 space-y-1" id="nav-menu"></nav>

        <div class="mt-auto space-y-3 border-t border-slate-200 pt-4 dark:border-slate-800">
          <button id="settings-nav" class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
            <i data-lucide="settings" class="h-4 w-4"></i>
            <span>Settings</span>
          </button>

          <div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-50 p-2.5 dark:border-slate-700 dark:bg-slate-800">
            <div class="flex items-center gap-3">
              <div id="sidebar-profile-avatar" class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 text-sm font-semibold text-white">U</div>
              <div class="min-w-0">
                <div id="sidebar-user-name" class="truncate text-sm font-semibold">Student</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">Level 7 learner</div>
              </div>
            </div>
            <button id="theme-toggle" aria-label="Toggle theme" class="rounded-lg border border-slate-200 p-2 text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-700">
              <i data-lucide="sun-medium" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </aside>

      <div class="md:pl-72">
        <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/80">
          <div class="flex items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
            <div class="flex items-center gap-3">
              <button id="open-sidebar" class="inline-flex rounded-xl border border-slate-200 p-2 text-slate-700 md:hidden dark:border-slate-700 dark:text-slate-200">
                <i data-lucide="menu" class="h-5 w-5"></i>
              </button>
              <div>
                <p class="text-sm text-slate-500 dark:text-slate-400">StudyFlow</p>
                <h1 id="page-title" class="text-xl font-bold tracking-tight">Dashboard</h1>
              </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
              <button id="global-search-trigger" class="hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 md:flex dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">
                <i data-lucide="search" class="h-4 w-4"></i>
                <span>Search</span>
                <span class="rounded bg-slate-200 px-1.5 py-0.5 text-[10px] font-semibold text-slate-600 dark:bg-slate-700 dark:text-slate-200">Ctrl K</span>
              </button>

              <button id="demo-data-btn" class="hidden rounded-xl border border-violet-200 bg-violet-50 px-3 py-2 text-sm font-medium text-violet-700 hover:bg-violet-100 md:inline-flex dark:border-violet-800 dark:bg-violet-950/40 dark:text-violet-300">
                Load Demo Data
              </button>

              <div class="relative">
                <button id="notification-toggle" class="relative rounded-xl border border-slate-200 bg-slate-50 p-2.5 text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
                  <i data-lucide="bell" class="h-4 w-4"></i>
                  <span id="notification-dot" class="absolute -right-1 -top-1 hidden h-2.5 w-2.5 rounded-full bg-rose-500"></span>
                </button>
                <div id="notification-panel" class="absolute right-0 top-12 hidden w-80 rounded-2xl border border-slate-200 bg-white p-3 shadow-soft dark:border-slate-700 dark:bg-slate-900"></div>
              </div>
            </div>
          </div>
        </header>

        <main id="app-content" class="px-4 py-6 sm:px-6 lg:px-8" aria-live="polite"></main>
      </div>
    </div>

    <div id="toast-container" class="fixed right-4 top-20 z-50 flex w-full max-w-sm flex-col gap-2"></div>
    <div id="modal-root"></div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/priority-engine.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/subjects.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/goals.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/search.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
